name: Native Enterprise Build Artifacts

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Native Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Run Kotlin Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest

      - name: Run Android Lint
        run: |
          cd android
          ./gradlew lintDebug

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
             [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Android release signing secrets are not configured."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/omniverse-release.jks
          {
            printf 'storeFile=../keystore/omniverse-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Compile signed APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Android Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Omniverse-android-release-apk
          path: android/app/build/outputs/apk/release/app-*.apk
          if-no-files-found: error

  build-ios:
    name: Build Native iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || \
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project via XcodeGen
        run: |
          cd ios
          xcodegen

      - name: Stamp iOS release version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 2.1.${{ github.run_number }}" ios/Omniverse/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" ios/Omniverse/Info.plist

      - name: Run Swift Unit Tests
        run: |
          xcodebuild -project ios/Omniverse.xcodeproj \
                     -scheme Omniverse \
                     -sdk iphonesimulator \
                     -destination 'platform=iOS Simulator,name=iPad mini (A17 Pro)' \
                     test

      - name: Run Xcode Static Analysis
        run: |
          xcodebuild -project ios/Omniverse.xcodeproj \
                     -scheme Omniverse \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     analyze \
                     CODE_SIGNING_ALLOWED=NO

      - name: Compile and Archive Swift App Bundle (Unsigned)
        run: |
          cd ios
          xcodebuild -project Omniverse.xcodeproj \
                     -scheme Omniverse \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/Omniverse.xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean archive

      - name: Package App Bundle into Unsigned IPA
        run: |
          mkdir -p ios/build/Payload
          cp -r ios/build/Omniverse.xcarchive/Products/Applications/Omniverse.app ios/build/Payload/
          cd ios/build
          zip -r ../../Omniverse-Unsigned.ipa Payload

      - name: Upload iOS Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Omniverse-ios-unsigned-ipa
          path: Omniverse-Unsigned.ipa
          if-no-files-found: error

  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: |
          cd desktop
          npm ci

      - name: Run Desktop Tests and Dependency Audit
        run: |
          cd desktop
          npm test
          npm audit --audit-level=high

      # Stamp the exact release version (matches the publish-release tag
      # v2.1.<run_number>) into package.json so the built app reports its true
      # version via app.getVersion(). The desktop updater compares that against
      # the latest GitHub release, so it only prompts when a HIGHER release exists.
      - name: Stamp release version
        shell: bash
        run: |
          cd desktop
          node -e "const fs=require('fs');const p=require('./package.json');p.version='2.1.${{ github.run_number }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "Stamped desktop version -> 2.1.${{ github.run_number }}"

      - name: Package Desktop Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd desktop
          npm run dist:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Desktop Binary (macOS)
        if: matrix.os == 'macos-14'
        run: |
          cd desktop
          npm run dist:mac -- --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS Signatures and Disk Images
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          apps=(
            "desktop/dist/mac-arm64/Omniverse.app"
            "desktop/dist/mac/Omniverse.app"
          )
          for app in "${apps[@]}"; do
            test -d "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done

          file "${apps[0]}/Contents/MacOS/Omniverse" | grep -q arm64
          file "${apps[1]}/Contents/MacOS/Omniverse" | grep -q x86_64

          version="$(node -p "require('./desktop/package.json').version")"
          dmgs=(
            "desktop/dist/Omniverse-${version}-arm64.dmg"
            "desktop/dist/Omniverse-${version}.dmg"
          )
          for dmg in "${dmgs[@]}"; do
            test -f "$dmg"
            hdiutil verify "$dmg"
          done

      - name: Package Desktop Binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd desktop
          npm run dist:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Omniverse-desktop-windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error

      - name: Upload Desktop Artifacts (macOS)
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: Omniverse-desktop-macos
          path: |
            desktop/dist/*.dmg
          if-no-files-found: error

      - name: Upload Desktop Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Omniverse-desktop-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  publish-release:
    name: Publish Production Release Assets
    needs: [build-android, build-ios, build-desktop]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Omniverse-android-release-apk
          path: out_android

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Omniverse-ios-unsigned-ipa
          path: out_ios

      - name: Download Windows Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: Omniverse-desktop-windows
          path: out_win

      - name: Download macOS Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: Omniverse-desktop-macos
          path: out_mac

      - name: Download Linux Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: Omniverse-desktop-linux
          path: out_linux

      - name: Package Release Assets
        run: |
          mkdir -p release_assets
          cp out_android/app-arm64-v8a-release.apk release_assets/Omniverse-android-arm64.apk || true
          cp out_android/app-universal-release.apk release_assets/Omniverse-android-universal.apk || true
          # Fallback if both missing
          if [ ! -f release_assets/Omniverse-android-arm64.apk ] && [ ! -f release_assets/Omniverse-android-universal.apk ]; then
            cp out_android/app-release.apk release_assets/Omniverse-android-universal.apk || true
          fi
          cp out_ios/Omniverse-Unsigned.ipa release_assets/Omniverse-Unsigned.ipa
          cp out_win/*.exe release_assets/
          cp out_mac/*.dmg release_assets/
          cp out_linux/*.AppImage release_assets/
          cp out_linux/*.deb release_assets/

      - name: Extract Release Notes
        run: |
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          if [ -f CHANGELOG.md ]; then
            sed -n '/^## /,$p' CHANGELOG.md | sed -n '1,/^---$/p' | head -n -1 >> $GITHUB_ENV || git log -1 --pretty=%B >> $GITHUB_ENV
          else
            git log -1 --pretty=%B >> $GITHUB_ENV
          fi
          echo "EOF" >> $GITHUB_ENV

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: Omniverse v2.1.${{ github.run_number }} Release
          body: |
            # ✨ Omniverse v2.1.${{ github.run_number }} Enterprise Release

            > **Ultimate Multi-Platform Streaming Client** — High Performance, Native Liquid-Glass Aesthetic & Zero-Ads Engine.

            ---

            ### 🚀 Highlights & Release Notes
            ${{ env.RELEASE_NOTES }}

            ---

            ### 📦 Official Installation Matrix

            | Platform | Installer Package | Compatibility & Instructions |
            | :--- | :--- | :--- |
            | 🤖 **Android** | `Omniverse-android-arm64.apk`<br>`Omniverse-android-universal.apk` | Direct install on Phones, Tablets, Android TV & Fire TV |
            | 🍎 **iOS / iPadOS** | `Omniverse-Unsigned.ipa` | Sideload via AltStore / SideStore / TrollStore / Xcode |
            | 💻 **Windows** | `Omniverse Setup *.exe` | Windows 10/11 x64 Auto-installer |
            | 🍏 **macOS** | `Omniverse-*.dmg` | macOS Apple Silicon (M1–M4) & Intel (Right-click Open on 1st launch) |
            | 🐧 **Linux** | `*.AppImage` / `*.deb` | Universal Linux AppImage & Debian/Ubuntu Package |

            ---

            ### ⚡ Core Platform Capabilities
            - 🛡️ **Built-in Shielding**: Integrated ad-blocker, pop-up suppressor, and tracking protection.
            - 💎 **Liquid Glass UX**: Apple-style space black canvas, floating translucent pills, and spring physics.
            - 🍿 **Cross-Device Sync**: Serverless QR & Trakt/AniList cloud watch history sync.
            - ⚡ **Multi-Engine Resolvers**: High-availability stream engines with auto-fallback servers.

            ---
            *Automated CI/CD Enterprise Build pipeline powered by GitHub Actions.*
          draft: false
          prerelease: false
          files: |
            release_assets/Omniverse-android-arm64.apk
            release_assets/Omniverse-android-universal.apk
            release_assets/Omniverse-Unsigned.ipa
            release_assets/*.exe
            release_assets/*.dmg
            release_assets/*.AppImage
            release_assets/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
