<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Omniverse Graphify codebase intelligence map</title>
  <desc id="desc">A static topology map of 2,281 nodes, 5,092 relationships, 185 communities, and 119 indexed files across Apple, Android, desktop, CI, contributor knowledge, and shared product services.</desc>
  <defs>
