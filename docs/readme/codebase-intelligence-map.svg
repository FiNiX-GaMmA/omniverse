      <stop offset="0" stop-color="#0d121c"/>
      <stop offset="0.52" stop-color="#07090e"/>
      <stop offset="1" stop-color="#12070c"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="64%">
      <stop offset="0" stop-color="#ff4058" stop-opacity=".36"/>
      <stop offset=".58" stop-color="#351018" stop-opacity=".84"/>
      <stop offset="1" stop-color="#0d0e14"/>
    </radialGradient>
    <radialGradient id="apple" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#50dce9" stop-opacity=".24"/>
      <stop offset="1" stop-color="#09131a"/>
